params:
  seed: 42

  # environment wrapper clipping
  env:
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: True
    space:
      continuous:
        mu_activation: None
        sigma_activation: None

        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -1.0
        fixed_sigma: True
    mlp:
      units: [256, 128, 64]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None
    
    # rnn:
    #   name: lstm
    #   units: 128
    #   layers: 3
    #   before_mlp: True

  load_checkpoint: False
  load_path: ''

  config:
    # run_m4_config.py stamps this from m4_config.py.
    name: atmo_combined_stage1
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: True
    ppo: True
    # PPO was producing non-finite policy std near epoch ~975. Keep full
    # precision until the run is numerically stable again.
    mixed_precision: False
    normalize_input: True
    normalize_value: False
    value_bootstrap: True
    num_actors: -1  # configured from the script (based on num_envs)
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.999
    tau: 0.97
    learning_rate: 3e-6
    lr_schedule: adaptive
    schedule_type: legacy
    kl_threshold: 0.016
    score_to_win: 200000000
    max_epochs: 20000
    save_best_after: 100
    save_frequency: 50
    grad_norm: 1.0
    entropy_coef: 0.001
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 36
    minibatch_size: 24576
    mini_epochs: 2
    critic_coef: 2
    clip_value: True
    seq_length: 4
    bounds_loss_coef: 0.0
